<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Task Tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
    <body class="min-h-screen bg-plum-950 text-blush-100">
    <main class="mx-auto max-w-xl p-6">
      <h1 class="text-4xl font-bold tracking-tight text-blush-100">Study Task Tracker</h1>
      <p class="mb-8 mt-2 text-blush-300">Plan it, tick it off, remember it.</p>

      <form id="task-form" class="mb-6 flex gap-2">
        <input id="task-input" type="text" placeholder="What do you need to study?" class="flex-1 rounded-lg border border-slate-300 bg-white px-4 py-2 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200" />
        <button type="submit" class="cursor-pointer rounded-lg bg-blue-600 px-4 py-2 font-medium text-white hover:bg-blue-700">Add</button>
      </form>

      <div id="filters" class="mb-4 flex gap-2">
        <button data-filter="all" class="cursor-pointer rounded-full border border-slate-300 bg-white px-4 py-1 text-sm font-medium text-slate-700 hover:bg-slate-200">All</button>
        <button data-filter="active" class="cursor-pointer rounded-full border border-slate-300 bg-white px-4 py-1 text-sm font-medium text-slate-700 hover:bg-slate-200">Active</button>
        <button data-filter="completed" class="cursor-pointer rounded-full border border-slate-300 bg-white px-4 py-1 text-sm font-medium text-slate-700 hover:bg-slate-200">Completed</button>
      </div>

      <ul id="task-list" class="space-y-2"></ul>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
