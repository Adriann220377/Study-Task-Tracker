<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Task Tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="min-h-screen bg-slate-100 text-slate-800">
    <main class="mx-auto max-w-xl p-6">
       <h1 class="mb-6 text-3xl font-bold">Study Task Tracker</h1>

      <form id="task-form" class="mb-6 flex gap-2">
        <input id="task-input" type="text" placeholder="What do you need to study?" class="flex-1 rounded-lg border border-slate-300 bg-white px-4 py-2 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200" />
        <button type="submit">Add</button>
      </form>

      <div id="filters">
        <button data-filter="all">All</button>
        <button data-filter="active">Active</button>
        <button data-filter="completed">Completed</button>
      </div>

      <ul id="task-list"></ul>
    </main>
  </body>
</html>
